<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 462">
<defs>
<marker id="ai" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#585860"/></marker>
<marker id="ar" markerWidth="9" markerHeight="9" refX="6.5" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 Z" fill="#CB4632"/></marker>
</defs>
<rect x="0.5" y="0.5" width="943" height="461" fill="#FCFBFA" stroke="#D9D6D1"/>
<text x="32" y="46" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#28282F">Writes do not parallelize</text><text x="32" y="69" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#585860">Two agents writing the same shared state cascade into one incompatible system.</text><rect x="32" y="204" width="120" height="56" fill="#FCFBFA" stroke="#8E8B84"/><text x="92" y="230" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#28282F" text-anchor="middle">user profile</text><text x="92" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#585860" text-anchor="middle">to create</text><line x1="152" y1="232" x2="178" y2="232" stroke="#585860" stroke-width="1.8"  marker-end="url(#ai)"/><rect x="180" y="100" width="324" height="264" fill="none" stroke="#D9D6D1"/><text x="196" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#585860">PARALLEL WRITES</text><rect x="198" y="136" width="146" height="58" fill="#EEF4FB" stroke="#2E78C8" stroke-opacity="0.5"/><rect x="198" y="136" width="4" height="58" fill="#2E78C8"/><text x="214" y="161" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#2E78C8">Agent A</text><text x="214" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#585860">{ id, name, role }</text><rect x="198" y="272" width="146" height="58" fill="#EEF4FB" stroke="#2E78C8" stroke-opacity="0.5"/><rect x="198" y="272" width="4" height="58" fill="#2E78C8"/><text x="214" y="297" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#2E78C8">Agent B</text><text x="214" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#585860">{ userId, fullName }</text><rect x="360" y="203" width="138" height="58" fill="#FBF3E4" stroke="#C9862A" stroke-opacity="0.5"/><rect x="360" y="203" width="4" height="58" fill="#C9862A"/><text x="376" y="228" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#C9862A">Agent C</text><text x="376" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#585860">merges into a 3rd</text><line x1="344" y1="188" x2="362" y2="209" stroke="#8E8B84" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ai)"/><line x1="344" y1="280" x2="362" y2="255" stroke="#8E8B84" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ai)"/><line x1="506" y1="232" x2="526" y2="232" stroke="#CB4632" stroke-width="1.8"  marker-end="url(#ar)"/><rect x="528" y="100" width="230" height="264" fill="none" stroke="#D9D6D1"/><text x="544" y="125" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.6" fill="#CB4632">CASCADING CONFLICTS</text><rect x="544" y="140" width="198" height="48" fill="#FBEBE7" stroke="#CB4632" stroke-opacity="0.5"/><rect x="544" y="140" width="4" height="48" fill="#CB4632"/><text x="560" y="169" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#28282F">three incompatible structures</text><rect x="544" y="195" width="198" height="48" fill="#FBEBE7" stroke="#CB4632" stroke-opacity="0.5"/><rect x="544" y="195" width="4" height="48" fill="#CB4632"/><text x="560" y="224" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#28282F">auth expects different fields</text><rect x="544" y="250" width="198" height="48" fill="#FBEBE7" stroke="#CB4632" stroke-opacity="0.5"/><rect x="544" y="250" width="4" height="48" fill="#CB4632"/><text x="560" y="279" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#28282F">database schema mismatched</text><rect x="544" y="305" width="198" height="48" fill="#FBEBE7" stroke="#CB4632" stroke-opacity="0.5"/><rect x="544" y="305" width="4" height="48" fill="#CB4632"/><text x="560" y="334" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#28282F">API endpoints broken</text><line x1="760" y1="232" x2="780" y2="232" stroke="#CB4632" stroke-width="1.8"  marker-end="url(#ar)"/><rect x="782" y="200" width="154" height="64" fill="#CB4632" stroke="#A6361F"/><text x="859" y="228" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#FCFBFA" text-anchor="middle">SYSTEM FAILURE</text><text x="859" y="248" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#F6D9D2" text-anchor="middle">complete rewrite</text><rect x="32" y="392" width="904" height="56" fill="#EBF4EF" stroke="#2D9566" stroke-opacity="0.5"/><rect x="32" y="392" width="4" height="56" fill="#2D9566"/><text x="50" y="417" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="0.5" fill="#2D9566">READS DO THE OPPOSITE</text><text x="50" y="437" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#28282F">Many agents read the same state at once and merge what they find. Nothing to reconcile, nothing to break.</text></svg>